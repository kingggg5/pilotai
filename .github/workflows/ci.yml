name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: node scripts/quality/vibe-check.test.mjs
      - run: node scripts/quality/vibe-check.mjs --json work/quality-gate-report.json --fail-on high
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run typecheck
      - run: npm --prefix apps/api test
      - run: npm --prefix apps/api run build
      - run: npm --prefix apps/api run eval:classifier
      - run: npm --prefix apps/api run eval:automation
      - run: npm --prefix apps/api run eval:rag
      - run: npm --prefix apps/api run eval:golden
      - run: npx --prefix apps/api tsx --test evals/golden-contract.test.ts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run lint -- --max-warnings=0
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test
      - run: npm --prefix apps/web run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker compose config --quiet
      - run: docker build apps/api
      - run: docker build apps/web
      - run: docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.29-alpine nginx -t
