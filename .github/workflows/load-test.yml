name: Staging load test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public staging URL to test
        required: true
        type: string
      scenario:
        description: health (liveness probe) or assist (authenticated workflow path)
        required: false
        default: "assist"
        type: choice
        options:
          - assist
          - health
      concurrency:
        description: Concurrent workers
        required: false
        default: "10"
        type: string
      duration_ms:
        description: Test duration in milliseconds
        required: false
        default: "30000"
        type: string
      tenant_id:
        description: Tenant header value for the assist scenario
        required: false
        default: "tenant-load"
        type: string

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - name: Run bounded load test
        env:
          LOAD_TEST_URL: ${{ inputs.target_url }}
          LOAD_TEST_SCENARIO: ${{ inputs.scenario }}
          LOAD_TEST_CONCURRENCY: ${{ inputs.concurrency }}
          LOAD_TEST_DURATION_MS: ${{ inputs.duration_ms }}
          LOAD_TEST_TENANT_ID: ${{ inputs.tenant_id }}
          LOAD_TEST_TOKEN: ${{ secrets.LOAD_TEST_TOKEN }}
        run: node scripts/load-test.mjs
