name: Security baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public staging URL to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
      - name: Run unauthenticated security smoke checks
        env:
          SECURITY_TEST_URL: ${{ inputs.target_url }}
        run: node scripts/security-smoke.mjs

  zap:
    runs-on: ubuntu-latest
    steps:
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@2b5fc7f98d837319798ab7f128ea50b7d40563b6 # v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: true
