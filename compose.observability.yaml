services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - servicepilot-prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      api: { condition: service_healthy }

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    volumes:
      - servicepilot-grafana:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      prometheus: { condition: service_started }

volumes:
  servicepilot-prometheus:
  servicepilot-grafana:

secrets:
  grafana_admin_password: { file: ./.secrets/grafana_admin_password }
